# === Kafka Broker ===
# Port 9093 = SASL_PLAINTEXT (Kerberos), port 29092 = PLAINTEXT internal
spring.kafka.bootstrap-servers=kafka:9093
spring.kafka.consumer.group-id=kafka-listener-group
spring.kafka.consumer.auto-offset-reset=earliest

kafka.topic.name=test-topic
kafka.topic.orders=mysql.orders

# Schema Registry di confluent-ksql.yml terekspos di localhost:8081
kafka.schema-registry.url=http://localhost:8081

# === Kerberos / SASL Authentication ===
# Ganti ke PLAINTEXT (dan bootstrap-servers ke port 29092) untuk nonaktifkan Kerberos
kafka.security.protocol=SASL_PLAINTEXT
kafka.security.sasl.mechanism=GSSAPI
kafka.security.sasl.kerberos-service-name=kafka

# Ambil keytab dari KDC container terlebih dahulu:
#   docker cp kdc:/keytabs/client.keytab C:/tmp/client.keytab
kafka.security.keytab-path=C:/opt/confluent/client.keytab
kafka.security.principal=client@CONFLUENT.LOCAL

# Lokasi krb5.conf dari setup Docker kita
kafka.security.krb5-conf-path=C:/opt/confluent/kerberos/krb5.conf

# Host KDC yang bisa diakses dari luar Docker (localhost karena port 88 di-map ke host).
# Nilai ini menggantikan hostname 'kdc' di dalam krb5.conf secara otomatis saat startup.
# Kosongkan (kafka.security.kdc-host=) untuk memakai krb5.conf apa adanya.
kafka.security.kdc-host=localhost
