# =====================================================================
# Kafka Client Properties — autentikasi Kerberos (GSSAPI)
#
# Cara pakai:
#   1. Dapatkan keytab dari container KDC:
#      docker cp kdc:/keytabs/client.keytab /tmp/client.keytab
#
#   2. Set KRB5_CONFIG ke file krb5.conf (atau copy ke /etc/krb5.conf):
#      export KRB5_CONFIG=/c/opt/confluent/kerberos/krb5.conf
#
#   3. Dapatkan TGT (opsional jika pakai useTicketCache):
#      kinit -kt /tmp/client.keytab client@CONFLUENT.LOCAL
#
#   4. Jalankan producer/consumer:
#      kafka-console-producer \
#        --bootstrap-server localhost:9093 \
#        --topic test-topic \
#        --producer.config /c/opt/confluent/kafka/client.properties
#
#      kafka-console-consumer \
#        --bootstrap-server localhost:9093 \
#        --topic test-topic \
#        --consumer.config /c/opt/confluent/kafka/client.properties \
#        --from-beginning
# =====================================================================

security.protocol=SASL_PLAINTEXT
sasl.mechanism=GSSAPI
sasl.kerberos.service.name=kafka

# Ganti path keyTab dengan lokasi file client.keytab di mesin Anda
sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required \
    useKeyTab=true \
    storeKey=true \
    keyTab="/tmp/client.keytab" \
    principal="client@CONFLUENT.LOCAL";
